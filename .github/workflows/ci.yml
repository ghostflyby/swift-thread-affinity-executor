name: CI

on:
  push:
    branches: [main]
    # Bare semver tags. The pattern doubles as a naming guard: any other tag
    # shape (e.g. experiments) triggers nothing.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
  # Tag deletion and release publication drive the release jobs below. The
  # four build/test jobs are gated off these events.
  delete:
  release:
    types: [published]

concurrency:
  # Keyed on the event name as well: `delete` and `release` events report the
  # default branch in `github.ref` and must neither cancel nor be cancelled
  # by in-flight branch CI.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: swift-format
    if: github.event_name != 'delete' && github.event_name != 'release'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install swift-format
        run: brew install swift-format
      - name: Lint
        run: swift-format lint --recursive --strict Package.swift Sources Tests

  test:
    name: ${{ matrix.os }} · ${{ matrix.config }}
    if: github.event_name != 'delete' && github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS needs the xcode-27 image: Xcode 26.x ships Swift 6.3 and cannot
    # load a 6.4 tools-version manifest. Linux is blocking: the dedicated
    # executor owns a Thread(block:) instead of subclassing Thread, and
    # ThreadID declares gettid directly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, config: debug }
          - { os: xcode-27, config: release }
          - { os: ubuntu-24.04, config: debug }
          - { os: ubuntu-24.04, config: release }
    steps:
      - uses: actions/checkout@v7
      # setup-swift v2's version catalog ends at 6.2.1; v3 resolves releases
      # through Swiftly and can install 6.4.2.
      - name: Set up Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.2"
      - name: Show toolchain
        run: swift --version
      # TSan was previously quarantined because the hosted macOS test process
      # stalled with no output. The stall was diagnosed in #1: blocking queue
      # waits occupied every cooperative-pool thread on the 3-vCPU runner, so
      # the producer task that would unblock them never ran. Those waits now
      # run on dedicated threads; TSan is back in the main debug matrix.
      - name: Build (ThreadSanitizer)
        if: matrix.config == 'debug'
        env:
          TSAN_OPTIONS: symbolize=0
        run: swift build -c debug --sanitize=thread
      # Linux TSan cannot see Synchronization.Mutex's slow-path acquire
      # (swiftlang/swift#94511). Suppress the known false-positive frames
      # until the toolchain carries swiftlang/swift#94425.
      - name: Test (ThreadSanitizer, Linux)
        if: matrix.config == 'debug' && runner.os == 'Linux'
        run: |
          swift_bin=$(readlink -f "$(command -v swift)")
          toolchain_bin=$(dirname "$swift_bin")
          export TSAN_OPTIONS="symbolize=1:external_symbolizer_path=$toolchain_bin/llvm-symbolizer:suppressions=$GITHUB_WORKSPACE/.github/tsan-suppressions.txt"
          swift test -c debug --sanitize=thread
      - name: Test (ThreadSanitizer, macOS)
        if: matrix.config == 'debug' && runner.os != 'Linux'
        env:
          TSAN_OPTIONS: symbolize=0
        run: swift test -c debug --sanitize=thread
      - name: Build
        if: matrix.config != 'debug'
        run: swift build -c ${{ matrix.config }}
      - name: Test
        if: matrix.config != 'debug'
        run: swift test -c ${{ matrix.config }}

  # setup-swift does not install Swift 6 on Windows (v2 stops at 5.6.3 and v3
  # has no Windows support), so Windows uses the community action on the
  # VS 2022 image. The dedicated executor is closure-based, so this leg is
  # blocking.
  windows:
    name: windows-2022
    if: github.event_name != 'delete' && github.event_name != 'release'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  apple-platforms:
    name: ${{ matrix.destination }}
    if: github.event_name != 'delete' && github.event_name != 'release'
    # Xcode 27 is the first Xcode with the Swift 6.4 toolchain.
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=tvOS
          - generic/platform=watchOS
          - generic/platform=visionOS
    steps:
      - uses: actions/checkout@v7
      - name: Build for ${{ matrix.destination }}
        run: >-
          xcodebuild -scheme ThreadAffinityExecutor
          -destination "${{ matrix.destination }}"
          -quiet build

  # Release mechanics. Changelog entries are written by hand in
  # `## [Unreleased]`; these jobs only handle the mechanics:
  # a semver tag publishes the Unreleased section as a draft release note,
  # deleting such a tag removes the draft, and publishing the draft folds
  # the Unreleased section into a version heading in CHANGELOG.md.

  draft-release:
    name: draft release (${{ github.ref_name }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, windows, apple-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract Unreleased section from CHANGELOG.md
        run: |
          awk '/^## \[Unreleased\]/{flag=1;next} /^## \[/ || /^\[[^]]+\]:/{flag=0} flag' CHANGELOG.md > "$RUNNER_TEMP/unreleased.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/unreleased.md"; then
            echo "::error::CHANGELOG.md has no entries under [Unreleased] — write them before tagging."
            exit 1
          fi
      - name: Create draft release with Unreleased notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --title "$TAG" --notes-file "$RUNNER_TEMP/unreleased.md"

  remove-draft-release:
    name: remove draft release (${{ github.event.ref }})
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only a draft whose tag is gone is removed; published releases are
      # left in place.
      - name: Remove draft release for deleted tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.ref }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
            echo "Removed draft release $TAG"
          else
            echo "No draft release for $TAG — nothing to do"
          fi

  fold-changelog:
    name: fold changelog (${{ github.event.release.tag_name }})
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # A repository rule requires main changes to arrive via pull request,
      # so the fold lands as a bot PR that is squash-merged immediately.
      # The ruleset demands zero approving reviews and no status checks,
      # which is what lets the same token merge its own fold PR.
      #
      # The fold itself is an in-repo transform (no third-party action:
      # keep-a-changelog-new-release enforces its own private link format
      # and rejected ours). The link convention is Keep a Changelog's own —
      # [Unreleased] and every release compare with the previous tag; the
      # first release, having no predecessor, links its tag page.
      - name: Fold Unreleased into ${{ github.event.release.tag_name }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! awk '/^## \[Unreleased\]/{flag=1;next} /^## \[/ || /^\[[^]]+\]:/{flag=0} flag' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "CHANGELOG.md has no [Unreleased] entries — nothing to fold"
            exit 0
          fi
          date=$(date +%F)
          base=$(sed -n 's#^\[Unreleased\]: \(.*\)/compare/.*$#\1#p' CHANGELOG.md | sed -n '1p')
          if [ -z "$base" ]; then
            echo "::error::no [Unreleased] compare link at the bottom of CHANGELOG.md"
            exit 1
          fi
          prev=$(sed -n 's#^\[Unreleased\]: .*/compare/\(.*\)\.\.\.HEAD$#\1#p' CHANGELOG.md | sed -n '1p')
          if [ -n "$prev" ]; then
            version_link="[$TAG]: $base/compare/$prev...$TAG"
          else
            version_link="[$TAG]: $base/releases/tag/$TAG"
          fi
          awk -v tag="$TAG" -v date="$date" -v base="$base" -v vlink="$version_link" '
            !folded && /^## \[Unreleased\]$/ {
              print; print ""; print "## [" tag "] - " date; folded = 1; next
            }
            /^\[Unreleased\]: .*\/compare\// {
              print "[Unreleased]: " base "/compare/" tag "...HEAD"
              print vlink
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.folded.md
          mv CHANGELOG.folded.md CHANGELOG.md
      - name: Open and merge the fold PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet; then
            echo "CHANGELOG.md unchanged — nothing to fold"
            exit 0
          fi
          branch="changelog/fold-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore(changelog): fold Unreleased into $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(changelog): fold Unreleased into $TAG" \
            --body "Automated changelog fold for release [$TAG](https://github.com/ghostflyby/swift-thread-affinity-executor/releases/tag/$TAG)."
          for attempt in 1 2 3; do
            if gh pr merge "$branch" --squash --delete-branch; then
              echo "Fold PR merged"
              exit 0
            fi
            echo "merge attempt $attempt failed — retrying after mergeability settles"
            sleep 5
          done
          echo "::error::could not merge the changelog fold PR — merge it manually"
          exit 1
